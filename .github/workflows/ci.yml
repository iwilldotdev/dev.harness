name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Skill contracts
        run: python3 scripts/validate_skills.py
      - name: Parser self-test
        run: python3 skills/dev-shared/scripts/extract_refs.py --self-test

  visual-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/visual-runner/package-lock.json
      - name: Install Chromium
        working-directory: tools/visual-runner
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Visual runner tests
        working-directory: tools/visual-runner
        run: npm test
